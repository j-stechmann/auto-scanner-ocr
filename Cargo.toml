[package]
name = "auto-scanner-ocr"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Flatbed scan -> searchable OCR PDF, in a terminal UI"
license = "GPL-2.0-or-later"

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults", "tokio", "serde"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
tokio-stream = "0.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "pnm"] }
libc = "0.2"
anyhow = "1.0"
regex = "1"
tempfile = "3"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
chrono = "0.4"
shellexpand = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true